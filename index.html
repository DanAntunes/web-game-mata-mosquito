<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta charset="UTF-8">
		<meta name="description" content="Jogo Mata-Mosquito desenvolvido em JavaScript">
		<meta name="keywords" content="HTML, CSS, JavaScript">
		<meta name="author" content="Danilo Antunes">
		<!-- Title -->
		<title>Mata-Mosquito - Menu </title>
    <!-- Framework -->
	  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<!-- Stylesheet -->
		<link rel="stylesheet" href="./public/assets/css/style.css" />



    <script>
      function iniciarJogo() {
        var nivel = document.getElementById('nivel').value

        if(nivel === '') {
          alert('Selecione um nível para iniciar o jogo')
          return false
        }

        window.location.href = 'game.html?' + nivel

      }
    </script>
	</head>
	<body>

		<div class="container">
			<div class="row">
				<div class="col">
					<div class="d-flex justify-content-center">
						<img src="./public/assets/img/game.png" />
					</div>
				</div>
			</div>

      <div class="row">
				<div class="col">
					<div class="d-flex justify-content-center">
            <div class="mb-2">
              <select class="form-control" id="nivel">
                <option value="">-- Selecione o nível --</option>
                <option value="normal">Normal</option>
                <option value="hard">Difícil</option>
                <option value="johnwick">John Wick</option>
              </select>
            </div>
          </div>
        </div>
      </div>

			<div class="row">
				<div class="col">
					<div class="d-flex justify-content-center">
						<button type="button" class="btn btn-danger btn-lg" onclick="iniciarJogo()">Iniciar Jogo</button>
					</div>
				</div>
			</div>
		</div>

	</body>
</html>
