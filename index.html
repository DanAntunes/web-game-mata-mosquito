<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="theme-color" content="#dc3545">
    
    <!-- Meta tags de SEO e Acessibilidade -->
    <meta name="description" content="Jogo Mata-Mosquito desenvolvido em JavaScript - Divirta-se combatendo mosquitos em diferentes níveis de dificuldade">
    <meta name="keywords" content="Jogo, Mata-Mosquito, JavaScript, Game, HTML5, CSS3, Bootstrap">
    <meta name="author" content="Danilo Antunes">
    <meta name="creator" content="Danilo Antunes">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Redes Sociais -->
    <meta property="og:title" content="Mata-Mosquito - Jogo em JavaScript">
    <meta property="og:description" content="Jogo interativo desenvolvido em JavaScript com diferentes níveis de dificuldade">
    <meta property="og:type" content="website">
    <meta property="og:url" content="URL_DO_SITE">
    <meta property="og:image" content="URL_DA_IMAGEM">

    <title>Mata-Mosquito - WebGame</title>

    <!-- Framework CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./src/assets/css/style.css">
    
    <!-- Pré-conexão para CDNs -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
</head>
<body>
    <!-- Navegação para Acessibilidade -->
    <a href="#main-content" class="visually-hidden-focusable">Pular para o conteúdo principal</a>

    <main id="main-content" class="container" role="main">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 text-center">
                <header role="banner">
                    <img src="./src/assets/img/game.png" 
                         class="img-fluid game-png"
                         alt="Ilustração do jogo Mata-Mosquito - Mosquito estilizado com fundo colorido"
                         aria-hidden="false">
                </header>

                <section class="game-controls" role="region" aria-labelledby="nivelLabel">
                    <div class="my-2">
                        <label for="nivel" id="nivelLabel" class="form-label h4 text-light">Selecione o nível de dificuldade</label>
                        <select class="form-select form-select-lg" 
                                id="nivel"
                                aria-describedby="nivelHelp"
                                required>
                            <option value="" selected disabled>Escolha um nível</option>
                            <option value="normal">Normal</option>
                            <option value="hard">Difícil</option>
                            <option value="johnwick">John Wick</option>
                        </select>
                        <div id="nivelHelp" class="form-text">O nível John Wick é extremamente desafiador!</div>
                    </div>

                    <button type="button" 
                            class="btn btn-danger btn-lg px-5"
                            onclick="iniciarJogo()"
                            role="button"
                            aria-label="Iniciar o jogo no nível selecionado">
                        Iniciar Jogo
                    </button>
                </section>
            </div>
        </div>
    </main>

    <footer class="mt-4 py-3 bg-footer" role="contentinfo">
        <div class="container">
            <div class="row">
                <div class="col text-center">
                    <p class="mb-0">
                        Desenvolvido por 
                        <a href="https://github.com/DanAntunes" 
                           target="_blank"
                           rel="noopener noreferrer"
                           aria-label="Abrir perfil do GitHub do desenvolvedor em nova janela">
                            Danilo Antunes
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Framework JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
    
    <!-- Script do Jogo -->
    <script src="./src/js/start.js" defer></script>
</body>
</html>
